name: Set up CPU LibTorch
description: Install the PyTorch version required by torch-sys for Linux CI
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install CPU PyTorch
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check --only-binary=:all: 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
    - name: Validate LibTorch and expose its runtime libraries
      shell: bash
      run: |
        python - <<'PY'
        import os
        from pathlib import Path
        import torch

        if torch.__version__.split('+')[0] != '2.10.0' or torch.version.cuda is not None:
            raise RuntimeError('Expected CPU PyTorch 2.10.0 for torch-sys 0.23.0')
        library = Path(torch.__file__).resolve().parent / 'lib'
        for name in ('libtorch.so', 'libtorch_cpu.so'):
            if not (library / name).is_file():
                raise RuntimeError(f'Missing LibTorch library: {name}')
        paths = [str(library)]
        if os.environ.get('LD_LIBRARY_PATH'):
            paths.append(os.environ['LD_LIBRARY_PATH'])
        with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
            output.write('LIBTORCH_USE_PYTORCH=1\n')
            output.write('LD_LIBRARY_PATH=' + os.pathsep.join(paths) + '\n')
        print('Validated CPU PyTorch ' + torch.__version__)
        PY
