name: NVIDIA hardware qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cuda:
    # Explicit opt-in runner; never substitute a hosted CPU or optional GPU.
    runs-on: [self-hosted, linux, x64, nvidia]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: themoretheless/.github/.github/actions/setup-rust@eb557370f9aae2547ddbbdce8bf2a8798e68dad2
      - name: Record hardware and sources
        run: |
          mkdir -p hardware-report
          nvidia-smi -q > hardware-report/nvidia.txt
          nvidia-smi --query-gpu=index,uuid,name,driver_version --format=csv,noheader > hardware-report/devices.csv
          rustc -Vv > hardware-report/rustc.txt
          git rev-parse HEAD > hardware-report/commit.txt
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          paths = sorted(p for p in Path('crates/rrrah-cuda/src').rglob('*') if p.is_file())
          Path('hardware-report/source-sha256.json').write_text(json.dumps({str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}, indent=2))
          PY
      - name: Require actual NVIDIA execution
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked -p rrrah-cuda --lib tests::nvidia_full_output_boundaries_hdr_alpha_and_managed_limits -- --exact --ignored --show-output --test-threads=1 |& tee hardware-report/test.log
          python3 scripts/verify-nvidia-hardware-evidence.py hardware-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cuda-hardware-${{ github.run_id }}
          path: hardware-report/
          if-no-files-found: error
