[advisories]
version = 2
ignore = []
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    # target-lexicon, required by native codec system-deps.
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    # astcenc-sys bindings; bundled Arm decoder is Apache-2.0.
    "Unlicense",
    # Required by the transitive `directories` crate (dirs-sys -> option-ext).
    "MPL-2.0",
]
confidence-threshold = 0.8
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
