[package]
name = "rrrah-wgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The GPU API rrrah builds on, re-exported from Forma's gpu-kit"

[dependencies]
gpu-kit = { git = "https://github.com/themoretheless/forma", branch = "release" }

# Upstream wgpu off macOS stays pinned to the version rrrah's vendored wgpu-hal patch targets.
[target.'cfg(not(target_os = "macos"))'.dependencies]
wgpu.workspace = true

[lints]
workspace = true
