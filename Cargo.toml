[workspace]
members = [
    "crates/rrrah-app",
    "crates/rrrah-bench",
    "crates/rrrah-cache",
    "crates/rrrah-core",
    "crates/rrrah-decode",
    "crates/rrrah-gpu",
]
default-members = ["crates/rrrah-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/example/rrrah"

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.8"
bytemuck = { version = "1.25", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5"
directories = "6.0"
env_logger = "0.11"
log = "0.4"
memmap2 = "0.9"
pollster = "0.4"
rawler = "=0.7.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"
wgpu = "=30.0.0"
winit = "0.30.8"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
