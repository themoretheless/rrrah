[package]
name = "rrrah-dedup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
raster = ["dep:rrrah-core"]
decode = ["raster", "dep:rrrah-decode"]

[dependencies]
rrrah-decode = { path = "../rrrah-decode", optional = true }
rrrah-core = { path = "../rrrah-core", optional = true }
blake3.workspace = true
thiserror.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
blake3.workspace = true

[lints]
workspace = true

