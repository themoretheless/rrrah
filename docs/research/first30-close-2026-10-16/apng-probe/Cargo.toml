[package]
name="rrrah-apng-first30-probe"
version="0.1.0"
edition="2024"
rust-version="1.92"
[workspace]
[dependencies]
rrrah-animation={path="../../../../crates/rrrah-animation"}
rrrah-core={path="../../../../crates/rrrah-core"}
image={version="0.25.9",default-features=false,features=["png"]}
flate2={version="=1.1.10",default-features=false,features=["zlib-rs"]}
serde_json={version="1"}
blake3="1"
libc="0.2"
[profile.release]
opt-level=3
lto=false
codegen-units=16
[patch.crates-io]
wgpu-hal={path="../../../../vendor/wgpu-hal"}
image={path="../../../../vendor/image"}
hayro={path="../../../../vendor/hayro"}
moxcms={path="../../../../vendor/moxcms"}
hayro-interpret={path="../../../../vendor/hayro-interpret"}
